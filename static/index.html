<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>对照阅读器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <h1>对照阅读器</h1>
        <p>既可专注阅读单篇文档，也可对照原文和译文</p>
      </div>
    </header>

    <section class="document-entry" aria-label="打开 Markdown 的方式">
      <div class="entry-option temporary-entry">
        <div>
          <strong>临时阅读</strong>
          <p>文件只保存在当前页面内存中，关闭或刷新后消失</p>
        </div>
        <input id="temporary-input" type="file" accept=".md,text/markdown,text/plain" multiple hidden>
        <button id="temporary-button" class="primary" type="button">临时打开文件</button>
      </div>
      <div class="entry-option library-entry">
        <div>
          <strong>服务器书库</strong>
          <p>文件上传到服务器长期保存，可保留进度和段落对应</p>
        </div>
        <input id="upload-input" type="file" accept=".md,text/markdown,text/plain" multiple hidden>
        <div class="entry-buttons">
          <button id="upload-button" class="secondary" type="button">导入到书库</button>
          <button id="manage-button" class="secondary" type="button">管理书库</button>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="文档选择">
      <label class="mode-control">
        <span>阅读方式</span>
        <select id="reading-mode">
          <option value="single">单页阅读</option>
          <option value="pair">对照阅读</option>
        </select>
      </label>
      <label>
        <span id="source-select-label">阅读文档</span>
        <select id="source-select"><option value="">选择 Markdown 文档</option></select>
      </label>
      <button id="swap-button" class="secondary pair-only" type="button" aria-label="交换文档">⇄ 交换</button>
      <label class="pair-only">
        <span>中文译文</span>
        <select id="translation-select"><option value="">选择 Markdown 文档</option></select>
      </label>
      <button id="open-button" class="primary" type="button">开始阅读</button>
    </section>

    <section id="reader-toolbar" class="reader-toolbar hidden" aria-label="阅读控制">
      <label class="pair-only">同步方式
        <select id="sync-mode">
          <option value="jump">段落跳转</option>
          <option value="off">关闭同步</option>
        </select>
      </label>
      <button id="mapping-button" class="secondary pair-only" type="button">调整对应</button>
      <button id="reset-mapping-button" class="secondary pair-only" type="button">重新自动对应</button>
      <button id="vocabulary-button" class="secondary" type="button">生词篮（0）</button>
      <button id="collapse-top-button" class="secondary" type="button">收起顶部</button>
      <span id="alignment-status" class="status"></span>
    </section>

    <div id="message" class="message">正在读取 Markdown 文档列表……</div>

    <section id="reader" class="reader hidden" aria-label="阅读文档">
      <div class="pane">
        <div class="pane-title">
          <strong id="source-pane-label">文档</strong><span id="source-name"></span>
          <button id="restore-top-button" class="secondary restore-top-button hidden" type="button">显示工具栏</button>
        </div>
        <article id="source-content" class="document" aria-label="阅读正文"></article>
      </div>
      <div id="splitter" class="splitter pair-only" role="separator" aria-label="调整左右文档宽度" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" tabindex="0"></div>
      <div class="pane translation-pane pair-only">
        <div class="pane-title">
          <strong>译文</strong><span id="translation-name"></span>
        </div>
        <article id="translation-content" class="document" aria-label="中文译文"></article>
      </div>
    </section>
  </main>

  <dialog id="manage-dialog">
    <div class="dialog-header">
      <div><h2>本地 Markdown</h2><p>保存在 Reader 独立的数据目录中</p></div>
      <button id="close-manage-button" class="secondary" type="button">关闭</button>
    </div>
    <div id="local-document-list" class="local-document-list"></div>
  </dialog>

  <button id="vocabulary-add-button" class="primary vocabulary-add-button hidden" type="button">＋ 加入生词</button>

  <dialog id="vocabulary-dialog" class="vocabulary-dialog">
    <div class="dialog-header">
      <div>
        <h2>本次生词</h2>
        <p id="vocabulary-document-title">尚未采集生词</p>
      </div>
      <button id="close-vocabulary-button" class="secondary" type="button">关闭</button>
    </div>
    <div id="vocabulary-list" class="vocabulary-list"></div>
    <div class="vocabulary-actions">
      <button id="clear-vocabulary-button" class="secondary" type="button">清空</button>
      <button id="copy-vocabulary-button" class="primary" type="button">复制完整学习提示词</button>
    </div>
  </dialog>

  <script src="marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
